name: Deploy to GitHub Pages

# Publishes the static site in ./frontend to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main, claude/zealous-mccarthy-8vegg2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache-bust asset URLs
        # Append the commit SHA to asset URLs so browsers always fetch the
        # latest JS/CSS instead of a stale cached copy.
        run: |
          v=${GITHUB_SHA::8}
          sed -i "s/styles\.css/styles.css?v=$v/; s/config\.js/config.js?v=$v/; s/app\.js/app.js?v=$v/" frontend/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend
      - id: deployment
        uses: actions/deploy-pages@v4
